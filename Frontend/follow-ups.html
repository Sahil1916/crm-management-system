<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CRM — Follow-ups</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f1117;--bg2:#171b26;--bg3:#1e2333;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--text:#e8eaf0;--muted:#7a8099;--accent:#4f8ef7;--accent2:#6ee7b7;--accent3:#f59e42;--accent4:#f87171;--accent5:#a78bfa;--sidebar-w:230px;--font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
  .sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--border)}.brand{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--accent)}.role-badge{display:inline-block;margin-top:4px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.2);padding:2px 8px;border-radius:20px}
  .nav-section{padding:16px 12px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;transition:.18s}
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}.nav-item.active{background:rgba(79,142,247,.12);color:var(--accent);font-weight:500}
  .sidebar-bottom{margin-top:auto;padding:16px;border-top:1px solid var(--border)}.user-pill{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent5));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}.user-info .name{font-weight:500;font-size:13px}.user-info .role{font-size:11px;color:var(--muted)}
  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
  .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .topbar-title{font-family:var(--font-head);font-size:17px;font-weight:600}.topbar-right{display:flex;align-items:center;gap:12px}
  .btn{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--font-body);border:none;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#3d7de8}
  .btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border2)}.btn-outline:hover{color:var(--text)}
  .content{padding:24px 28px;flex:1}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .stat-card .label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
  .stat-card .value{font-family:var(--font-head);font-size:26px;font-weight:700;line-height:1;margin-bottom:4px}
  .stat-card .sub{font-size:11px;color:var(--muted)}
  .stat-card.today .value{color:var(--accent)}.stat-card.overdue .value{color:var(--accent4)}.stat-card.week .value{color:var(--accent2)}.stat-card.completed .value{color:var(--accent5)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .search{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;font-family:var(--font-body);width:280px}
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 14px;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
  td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}tbody tr:hover{background:rgba(255,255,255,.025)}
  .user-cell{display:flex;align-items:center;gap:10px}
  .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent5))}
  .uname{font-weight:500;font-size:13px}.uphone{font-size:11px;color:var(--muted)}
  .status-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
  .pill-scheduled{background:rgba(79,142,247,.15);color:var(--accent)}
  .pill-overdue{background:rgba(248,113,113,.15);color:var(--accent4)}
  .pill-completed{background:rgba(110,231,183,.15);color:var(--accent2)}
  .pill-cancelled{background:rgba(122,128,153,.15);color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:36px}
  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200}
  .modal-overlay.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;margin:16px}
  .modal-title{font-family:var(--font-head);font-size:16px;font-weight:600;padding:20px 24px 0}
  .modal-body{padding:16px 24px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--border)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
  .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-family:var(--font-body);outline:none}
  .form-group textarea{resize:vertical}
  @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="brand">SahilCRM</div><div class="role-badge" id="roleBadge">CRM</div></div>
  <div class="nav-section">Workspace</div>
  <div id="navLinks"></div>
  <div class="sidebar-bottom"><div class="user-pill"><div class="avatar" id="userAvatar">U</div><div class="user-info"><div class="name" id="userName">User</div><div class="role" id="userRole">CRM</div></div></div></div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">Follow-ups</div>
    <div class="topbar-right">
      <button class="btn btn-outline" onclick="loadFollowUps()">Refresh</button>
      <button class="btn btn-primary" onclick="openScheduleModal()">+ Schedule Follow-up</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid">
      <div class="stat-card today"><div class="label">Today</div><div class="value" id="statToday">0</div><div class="sub">Scheduled for today</div></div>
      <div class="stat-card overdue"><div class="label">Overdue</div><div class="value" id="statOverdue">0</div><div class="sub">Need immediate action</div></div>
      <div class="stat-card week"><div class="label">This Week</div><div class="value" id="statWeek">0</div><div class="sub">Upcoming 7 days</div></div>
      <div class="stat-card completed"><div class="label">Completed</div><div class="value" id="statCompleted">0</div><div class="sub">All time</div></div>
    </div>

    <div class="toolbar">
      <input class="search" placeholder="Search by lead name or notes..." oninput="filterFollowUps(this.value)"/>
      <select class="search" style="width:160px" onchange="renderFollowUps()">
        <option value="">All statuses</option>
        <option value="SCHEDULED">Scheduled</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Lead</th>
            <th>Scheduled Date</th>
            <th>Status</th>
            <th>Counselor</th>
            <th>Notes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="followupBody"><tr><td colspan="6" class="empty">Loading follow-ups...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Schedule Modal -->
<div class="modal-overlay" id="scheduleModal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal">
    <div class="modal-title">Schedule Follow-up</div>
    <div class="modal-body">
      <div class="form-group">
        <label>Lead</label>
        <select id="fuLeadSelect"></select>
      </div>
      <div class="form-group">
        <label>Scheduled Date & Time</label>
        <input type="datetime-local" id="fuDate"/>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="fuNotes" rows="3" placeholder="What needs to be discussed?"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="document.getElementById('scheduleModal').classList.remove('show')">Cancel</button>
      <button class="btn btn-primary" onclick="saveFollowUp()">Schedule</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
let allFollowUps = [];

function initShell() {
  if (!checkAuth()) return false;
  const user = getCurrentUser();
  const role = localStorage.getItem('role') || user.role || 'CRM';
  const initials = (user.name || user.email || 'U').split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
  document.getElementById('roleBadge').textContent = role;
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('userName').textContent = user.name || user.email;
  document.getElementById('userRole').textContent = role;
  const isCounselor = role === 'COUNSELOR';
  document.getElementById('navLinks').innerHTML = isCounselor ? counselorNav() : adminNav();
  return true;
}

function adminNav() {
  return `<a href="admin-dashboard.html" class="nav-item">Dashboard</a>
    <a href="manage-users.html" class="nav-item">Manage Users</a>
    <a href="manage-lists.html" class="nav-item">Manage Lists</a>
    <a href="manage-leads.html" class="nav-item">Manage Leads</a>
    <a href="courses.html" class="nav-item">Courses</a>
    <div class="nav-section">Analytics</div>
    <a href="reports.html" class="nav-item">Reports</a>
    <a href="follow-ups.html" class="nav-item active">Follow-ups</a>
    <a href="call-records.html" class="nav-item">Call Records</a>
    <a href="admissions.html" class="nav-item">Admissions</a>
    <div class="nav-section">System</div>
    <a href="settings.html" class="nav-item">Settings</a>`;
}

function counselorNav() {
  return `<a href="counselor-dashboard.html" class="nav-item">Dashboard</a>
    <a href="counselor-followups.html" class="nav-item active">Follow-ups</a>
    <a href="counselor-leads.html" class="nav-item">My Leads</a>
    <a href="call-records.html" class="nav-item">Call Records</a>
    <a href="admissions.html" class="nav-item">Admissions</a>
    <a href="settings.html" class="nav-item">Settings</a>`;
}

async function loadFollowUps() {
  try {
    const user = getCurrentUser();
    const role = localStorage.getItem('role') || user.role;
    const endpoint = role === 'COUNSELOR'
      ? '/api/followups/counselor/' + user.id
      : '/api/followups';
    allFollowUps = await apiGet(endpoint).catch(() => []);
    renderFollowUps();
  } catch (e) {
    showToast('Failed to load follow-ups: ' + e.message, 'error');
  }
}

function renderFollowUps() {
  const statusFilter = document.querySelector('select').value;
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const todayEnd = new Date(todayStart.getTime() + 86400000);
  const weekEnd = new Date(todayStart.getTime() + 7 * 86400000);

  const today = allFollowUps.filter(f => {
    const d = new Date(f.scheduledDate);
    return d >= todayStart && d < todayEnd && f.status === 'SCHEDULED';
  }).length;

  const overdue = allFollowUps.filter(f => {
    return new Date(f.scheduledDate) < todayStart && f.status === 'SCHEDULED';
  }).length;

  const week = allFollowUps.filter(f => {
    const d = new Date(f.scheduledDate);
    return d >= todayStart && d < weekEnd && f.status === 'SCHEDULED';
  }).length;

  const completed = allFollowUps.filter(f => f.status === 'COMPLETED').length;

  document.getElementById('statToday').textContent = today;
  document.getElementById('statOverdue').textContent = overdue;
  document.getElementById('statWeek').textContent = week;
  document.getElementById('statCompleted').textContent = completed;

  const filtered = statusFilter
    ? allFollowUps.filter(f => f.status === statusFilter)
    : allFollowUps;

  const tbody = document.getElementById('followupBody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No follow-ups found.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(f => {
    const lead = f.lead || {};
    const counselor = f.counselor || {};
    const initials = ((lead.firstName || '?')[0] + (lead.lastName || '?')[0]).toUpperCase();
    const scheduled = new Date(f.scheduledDate);
    const isOverdue = scheduled < todayStart && f.status === 'SCHEDULED';
    const statusClass = isOverdue ? 'pill-overdue' : 'pill-' + (f.status || 'scheduled').toLowerCase();
    const statusLabel = isOverdue ? 'Overdue' : (f.status || 'SCHEDULED');

    return `<tr>
      <td>
        <div class="user-cell">
          <div class="av">${initials}</div>
          <div>
            <div class="uname">${lead.firstName || ''} ${lead.lastName || ''}</div>
            <div class="uphone">${lead.phone ? '+91 ' + lead.phone : lead.email || ''}</div>
          </div>
        </div>
      </td>
      <td>${formatDate(f.scheduledDate)}</td>
      <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
      <td>${counselor.name || 'Unassigned'}</td>
      <td style="max-width:180px;color:var(--muted);font-size:12px">${f.notes || '-'}</td>
      <td>
        ${f.status === 'SCHEDULED' || isOverdue
          ? `<button class="btn btn-outline" style="font-size:11px;padding:4px 9px;" onclick="markDone(${f.id})">Mark Done</button>`
          : `<span style="font-size:12px;color:var(--muted)">—</span>`
        }
      </td>
    </tr>`;
  }).join('');
}

function filterFollowUps(query) {
  const q = query.toLowerCase();
  const rows = document.querySelectorAll('#followupBody tr');
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function formatDate(value) {
  if (!value) return '-';
  const d = new Date(value);
  if (isNaN(d)) return '-';
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrowStart = new Date(todayStart.getTime() + 86400000);
  const yesterdayStart = new Date(todayStart.getTime() - 86400000);
  const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  if (d >= todayStart && d < tomorrowStart) return `Today, ${time}`;
  if (d >= yesterdayStart && d < todayStart) return `Yesterday, ${time}`;
  if (d >= tomorrowStart && d < new Date(tomorrowStart.getTime() + 86400000)) return `Tomorrow, ${time}`;
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + time;
}

async function markDone(id) {
  const fu = allFollowUps.find(f => f.id === id);
  if (!fu) return;
  try {
    await apiPut('/api/followups/' + id, { ...fu, status: 'COMPLETED', lead: fu.lead ? { id: fu.lead.id } : null, counselor: fu.counselor ? { id: fu.counselor.id } : null });
    showToast('Marked as completed', 'success');
    loadFollowUps();
  } catch (e) {
    showToast('Failed: ' + e.message, 'error');
  }
}

async function openScheduleModal() {
  try {
    const user = getCurrentUser();
    const role = localStorage.getItem('role') || user.role;
    const leads = role === 'COUNSELOR'
      ? await apiGet('/api/leads/counselor/' + user.id).catch(() => [])
      : await apiGet('/api/leads').catch(() => []);

    document.getElementById('fuLeadSelect').innerHTML = leads.map(l =>
      `<option value="${l.id}">${l.firstName} ${l.lastName} — ${l.course || ''}</option>`
    ).join('');

    // Default to now + 1 hour
    const def = new Date(Date.now() + 3600000);
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('fuDate').value =
      `${def.getFullYear()}-${pad(def.getMonth()+1)}-${pad(def.getDate())}T${pad(def.getHours())}:${pad(def.getMinutes())}`;
    document.getElementById('fuNotes').value = '';
    document.getElementById('scheduleModal').classList.add('show');
  } catch (e) {
    showToast('Failed to load leads: ' + e.message, 'error');
  }
}

async function saveFollowUp() {
  const leadId = document.getElementById('fuLeadSelect').value;
  const date = document.getElementById('fuDate').value;
  const notes = document.getElementById('fuNotes').value.trim();
  if (!leadId || !date) { showToast('Lead and date are required', 'error'); return; }
  const user = getCurrentUser();
  try {
    await apiPost('/api/followups', {
      lead: { id: parseInt(leadId) },
      counselor: { id: user.id },
      scheduledDate: date + ':00',
      notes,
      status: 'SCHEDULED'
    });
    showToast('Follow-up scheduled', 'success');
    document.getElementById('scheduleModal').classList.remove('show');
    loadFollowUps();
  } catch (e) {
    showToast('Failed: ' + e.message, 'error');
  }
}

if (initShell()) loadFollowUps();
</script>
<script src="frontend-qa.js"></script>
</body>
</html>
