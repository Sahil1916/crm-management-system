server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/admitpro_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}

app.jwt.secret=${JWT_SECRET:YWRtaXRwcm8tc2VjcmV0LWtleS0zMi1jaGFycy1sb25nISE=}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

logging.level.com.admitpro=INFO
logging.level.org.springframework.security=WARN
