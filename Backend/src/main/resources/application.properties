# ===== ACTIVE PROFILE (override with -Dspring.profiles.active=prod) =====
spring.profiles.active=${APP_PROFILE:dev}

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sahilcrm_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===== JWT (MUST be set via env var in production) =====
app.jwt.secret=${JWT_SECRET:CHANGE_ME_SET_JWT_SECRET_ENV_VAR_MIN_64_CHARS_LONG_RANDOM_STRING}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== CORS =====
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5500}

# ===== LOGGING =====
logging.level.root=WARN
logging.level.com.sahilcrm=INFO
logging.level.org.springframework.security=WARN

# ===== ACTUATOR (health check only) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
